adr:
  - { id: "ADR-1", desc: "Cablear rollover mensual en boot (useMonthRollover)" }
  - { id: "ADR-2", desc: "Schema V5 con migración aditiva para userName" }
  - { id: "ADR-3", desc: "SpendingPaceBadge propio, no extender ComparisonBadge" }
  - { id: "ADR-4", desc: "Snapshot: fuente única de tipo desde schema Zod; eliminar as any de main.ts" }
open_questions:
  - id: "OQ-1"
    desc: "Actividad reciente: adaptar a categorías del mes vs construir ledger de movimientos con fecha"
    status: resolved
    resolution: "Actividad del mes por categoría; ledger fuera de alcance (feature futuro)"
  - id: "OQ-2"
    desc: "Base de cálculo del % gastos vs mes anterior y comportamiento sin histórico"
    status: resolved
    resolution: "Badge héroe = ritmo de gasto variable vs mes anterior ajustado por días transcurridos; gráfica = gasto total por mes cerrado; sin histórico = neutro sin badge"
  - id: "OQ-3"
    desc: "Saludo: nombre opcional en ajustes vs saludo genérico por franja horaria"
    status: resolved
    resolution: "Nombre opcional en ajustes (≤30 chars) + fallback por franja horaria; dato local"
  - id: "OQ-4"
    desc: "Tarjetas de patrimonio: tres fijas (activos/deudas/neto) vs una por activo"
    status: resolved
    resolution: "Tres fijas: Tengo / Debo / Neto con drill-down"
assumptions:
  - id: "A-001"
    stated_in: plan
    text: "Schema Zod V4 de snapshots ya incluye totalVariableSpent compatible con buildSnapshot()"
    impact_if_wrong: M
    verify_by: "Verificado leyendo schema.ts L165-177 (2026-06-09)"
    status: verified
  - id: "A-002"
    stated_in: plan
    text: "Hidratación de snapshots es pass-through directo; re-tipar el store no rompe datos V4; debtPayments nuevo cubierto por migrate v5 default 0"
    impact_if_wrong: H
    verify_by: "Verificado en main.ts L66/L111 (2026-06-09); test migración V4→V5 en fase 5"
    status: verified
  - id: "A-003"
    stated_in: plan
    text: "chart.js instalado expone BarElement sin dependencia nueva"
    impact_if_wrong: L
    verify_by: "Import en CashFlowChart + suite verde"
    status: verified
  - id: "A-004"
    stated_in: plan
    text: "Rollover detectado solo en boot es suficiente (sesiones no cruzan fin de mes)"
    impact_if_wrong: L
    verify_by: "ADR-1; revisar en feedback post-release"
    status: unverified
  - id: "A-005"
    stated_in: plan
    text: "Fold 390x844 admite saludo compacto + cobertura Mi Día + héroe sin reducir Mi Día"
    impact_if_wrong: M
    verify_by: "E2E móvil de fold en fase 5"
    status: verified
