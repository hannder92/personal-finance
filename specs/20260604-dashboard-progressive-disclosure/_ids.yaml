open_questions:
  - id: OQ-1
    text: "Desktop (≥768px) — tier 2 siempre expandido sin toggle?"
    decision: "Sí — mobile-only collapse"
    status: resolved
    resolved_at: "2026-06-04"
  - id: OQ-2
    text: "Fresh user sin ingresos — tier 2 colapsado aunque sessionStorage diga expandido?"
    decision: "Sí — evitar gráficos vacíos"
    status: resolved
    resolved_at: "2026-06-04"
  - id: OQ-3
    text: "Copy del toggle — específico vs genérico"
    decision: "Específico — i18n dashboard.tier2.expand/collapse"
    status: resolved
    resolved_at: "2026-06-04"
