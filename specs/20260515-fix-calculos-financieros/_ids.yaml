ac:
  - {id: "AC-1.1", desc: "Datos persisten al recargar (cualquier tipo)"}
  - {id: "AC-1.2", desc: "Deuda persiste con todos sus campos al recargar"}
  - {id: "AC-1.3", desc: "Deuda + deducción coexisten correctamente al recargar"}
  - {id: "AC-1.4", desc: "Error de guardado muestra aviso visible"}
  - {id: "AC-2.1", desc: "Ingreso neto $11.132.000 para bruto $12.100.000 con 8% deducciones"}
  - {id: "AC-2.2", desc: "Panel distribución usa ingreso neto"}
  - {id: "AC-2.3", desc: "Disponible dashboard = ingreso neto − gastos − deudas"}
  - {id: "AC-2.4", desc: "Beneficios extrasalariales se suman post-deducciones"}
  - {id: "AC-2.5", desc: "Sin deducciones → ingreso neto = bruto, sin error"}
  - {id: "AC-3.1", desc: "Componente vivienda = gastos vivienda / ingreso neto"}
  - {id: "AC-3.2", desc: "Componente emergencia = activos líquidos / (gastos fijos + obligaciones deuda mínimas)"}
  - {id: "AC-3.3", desc: "Componente ahorro = contrib. mensuales metas / ingreso neto (tasa real)"}
  - {id: "AC-3.4", desc: "Sin activos → emergencia muestra sin datos; puntaje se recalcula"}
  - {id: "AC-3.5", desc: "Agregar activo líquido recalcula componente emergencia"}
  - {id: "AC-3.6", desc: "Agregar gasto vivienda recalcula componente vivienda"}
  - {id: "AC-4.1", desc: "TEM derivada de TEA 30% ≈ 2.21% < 2.5% nominal/12 → menos meses de pago"}
  - {id: "AC-4.2", desc: "Total pagos deuda incluye cuotas de compras activas"}
  - {id: "AC-4.3", desc: "DTI = (mínimo + cuotas) / ingreso neto"}
  - {id: "AC-4.4", desc: "Pago < intereses → tiempo liquidación indefinido"}
  - {id: "AC-5.1", desc: "Meses de prima tienen saldo mayor en proyección"}
  - {id: "AC-5.2", desc: "Ingresos no mensuales solo aparecen en sus meses"}
  - {id: "AC-5.3", desc: "Proyección flujo de caja usa ingreso neto como base"}
  - {id: "AC-6.1", desc: "Cupo metas = % ahorro distribución × ingreso neto"}
  - {id: "AC-6.2", desc: "Cambio % ahorro actualiza cupo metas automáticamente"}
  - {id: "AC-7.1", desc: "Botón prima sin prima existente: crea entrada semestral = bruto/2"}
  - {id: "AC-7.2", desc: "Botón prima con prima existente: actualiza monto = bruto/2 (sin duplicar)"}
  - {id: "AC-7.3", desc: "Prima se puede editar/eliminar y cambio persiste al recargar"}
  - {id: "AC-8.1", desc: "Proyección hipotética: acumulación mensual 12m si ahorra X% ingreso neto"}
  - {id: "AC-8.2", desc: "Proyección compuesta: crecimiento activos reales con tasa configurada"}
  - {id: "AC-8.3", desc: "Ambas curvas simultáneas visualmente distinguibles"}
  - {id: "AC-8.4", desc: "Cambio % ahorro actualiza proyección hipotética automáticamente"}
  - {id: "AC-8.5", desc: "Sin tasa rendimiento → mensaje indicando configurar tasa"}
  - {id: "AC-8.6", desc: "Valor mes 12 curva compuesta > saldo inicial cuando tasa > 0"}

