adr:
  - {id: "ADR-1", decision: "APR field = TEA; formula (1+TEA)^(1/12)-1",              covers: ["AC-4.1", "AC-4.4"]}
  - {id: "ADR-2", decision: "New module lib/calculations/savings-projection.ts",       covers: ["AC-8.1", "AC-8.2", "AC-8.6"]}
  - {id: "ADR-3", decision: "Migration v2→v3: Asset.annualRatePercent default 0",      covers: ["AC-8.2", "AC-8.5"]}
  - {id: "ADR-4", decision: "Storage error UX = sticky toast + retry CTA",             covers: ["AC-1.4"]}
  - {id: "ADR-5", decision: "Single chart with two series (hypothetical + compound)",  covers: ["AC-8.3"]}
  - {id: "ADR-6", decision: "Prima upsert by reserved id __prima__ + isPrima flag",   covers: ["AC-7.1", "AC-7.2", "AC-7.3"]}

open_questions:
  - {id: "OQ-1", text: "Prima: auto-update or manual?", resolved: true, resolution: "Button always adds or updates with current salary."}
  - {id: "OQ-2", text: "Savings health score: allocation % or real contributions?", resolved: true, resolution: "Both: health uses real rate; US-8 adds hypothetical curve."}
  - {id: "OQ-3", text: "Compound rate: per-asset or single global rate?", resolved: true, resolution: "Per asset — each savings/investment asset has its own EA field."}
