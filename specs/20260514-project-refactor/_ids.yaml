adr:
  - {id: "ADR-1", decision: "Pinia setup-style stores (Composition API)", covers: "AC-2.x, AC-4.x, AC-5.x, AC-7.x, AC-8.x, AC-9.x, AC-13.x, AC-14.x"}
  - {id: "ADR-2", decision: "Chart.js via vue-chartjs@5.x wrapper", covers: "AC-5.6, AC-10.2, AC-12.1, AC-12.2, AC-12.3, AC-17.2"}
  - {id: "ADR-3", decision: "Persistence via central useAppStorage() composable en lib/storage (single key, Zod validation, migrate on boot)", covers: "EC-5, EC-6, AC-15.1, AC-15.2"}
  - {id: "ADR-4", decision: "Versioned migration chain: migrations: Record<number, (s) => s> aplicadas secuencialmente", covers: "EC-5"}
  - {id: "ADR-5", decision: "Form validation con Zod + custom useForm<T>(schema) composable (sin vee-validate)", covers: "AC-15.3, AC-14.2"}
  - {id: "ADR-6", decision: "Health score: re-normalizar pesos cuando hay componentes faltantes (Option 1)", covers: "AC-11.1, AC-11.4"}
  - {id: "ADR-7", decision: "Snapshot auto-save via useMonthRollover composable en App.vue mount (comparar YYYY-MM con lastMonthSeen)", covers: "AC-8.4, AC-13.1, AC-13.2"}
  - {id: "ADR-8", decision: "Tema: Tailwind class strategy + tri-state setting (light/dark/system)", covers: "AC-16.3, AC-17.1, AC-17.2"}
  - {id: "ADR-9", decision: "Onboarding: flag done + step index en settingsStore + beforeEach router guard para redirect", covers: "AC-1.1, AC-1.2, AC-1.3, AC-1.4, AC-1.5, AC-1.6, EC-9"}

open_questions:
  - {id: "Q-1", text: "¿El snapshot mensual se guarda automáticamente o con confirmación del usuario?", resolved: true, resolution: "Automático silencioso con notificación breve no bloqueante (→ AC-13.1)"}
  - {id: "Q-2", text: "¿Cuáles son los pesos de cada componente del health score?", resolved: true, resolution: "DTI 35%, Emergencia 30%, Vivienda 20%, Ahorro 15% — basado en literatura CFPB y contexto latinoamericano (→ AC-11.2)"}
  - {id: "Q-3", text: "¿En qué secciones aparece el botón flotante de registro rápido?", resolved: true, resolution: "Solo en Dashboard y Gastos Variables (→ AC-8.3)"}
  - {id: "Q-4", text: "¿El onboarding relanzable borra los datos existentes?", resolved: true, resolution: "No — onboarding se abre con datos actuales precargados, sin borrar nada (→ AC-1.6)"}
