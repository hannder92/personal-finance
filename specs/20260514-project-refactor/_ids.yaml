ac:
  - {id: "AC-1.1",  desc: "Dado primera vez (sin datos), veo pantalla de bienvenida con paso a paso: salario → gastos → deudas"}
  - {id: "AC-1.2",  desc: "Dado onboarding, cuando completo paso y avanzo, la barra de progreso avanza y muestra pasos restantes"}
  - {id: "AC-1.3",  desc: "Dado datos ya guardados, cuando abro la app, el onboarding no aparece y voy directo al dashboard"}
  - {id: "AC-1.4",  desc: "Dado onboarding activo, cuando presiono 'Saltar configuración', el wizard desaparece"}
  - {id: "AC-1.5",  desc: "Dado onboarding completado (3 pasos), cuando completo el último, veo dashboard con datos y mensaje de confirmación"}
  - {id: "AC-1.6",  desc: "Dado datos existentes, cuando presiono 'Relanzar guía', onboarding se abre con datos actuales precargados sin borrar nada"}
  - {id: "AC-2.1",  desc: "Dado salario bruto, cuando agrego deducción porcentual, el campo muestra el monto equivalente calculado en tiempo real"}
  - {id: "AC-2.2",  desc: "Dado moneda COP, cuando presiono 'Cargar deducciones Colombia', se agregan Salud 4% y Pensión 4% sin duplicar existentes"}
  - {id: "AC-2.3",  desc: "Dado bruto y deducciones, cuando presiono 'Calcular retención', se agrega/actualiza retención Art. 383 ET UVT 2025 con etiqueta estimado"}
  - {id: "AC-2.4",  desc: "Dado beneficio extrasalarial, cuando lo agrego, su monto se suma al neto sin alterar base de deducciones ni retención"}
  - {id: "AC-2.5",  desc: "Dado cambio de salario bruto, cuando modifico el campo, neto, deducciones porcentuales y retención se recalculan automáticamente"}
  - {id: "AC-3.1",  desc: "Dado ingreso adicional, cuando selecciono frecuencia (mensual/trimestral/semestral/anual), el dashboard muestra su equivalente mensual promedio"}
  - {id: "AC-3.2",  desc: "Dado ingreso semestral registrado, cuando veo proyección 12 meses, ese ingreso aparece solo en meses 6 y 12, no distribuido"}
  - {id: "AC-3.3",  desc: "Dado moneda COP y salario, cuando presiono 'Cargar prima de servicios', se agrega ingreso semestral = medio salario bruto, idempotente"}
  - {id: "AC-4.1",  desc: "Dado gasto fijo agregado (nombre, monto, categoría), aparece en la lista y el total de gastos fijos se actualiza inmediatamente"}
  - {id: "AC-4.2",  desc: "Dado gastos fijos registrados, cuando veo la sección, veo el total y el disponible después de aplicarlos al ingreso neto"}
  - {id: "AC-4.3",  desc: "Dado gasto categoría 'Vivienda', cuando veo salud financiera, ese monto se usa para calcular el ratio de vivienda"}
  - {id: "AC-4.4",  desc: "Dado eliminar gasto fijo y confirmar, desaparece de la lista y los totales se recalculan"}
  - {id: "AC-5.1",  desc: "Dado tarjeta con saldo, tasa EA, pago mínimo y fecha de corte, la tarjeta muestra línea de tiempo de pago y barra de utilización"}
  - {id: "AC-5.2",  desc: "Dado préstamo (no tarjeta), el formulario muestra campo de plazo en cuotas y la línea de tiempo muestra 'cuotas restantes'"}
  - {id: "AC-5.3",  desc: "Dado monto extra en simulador, veo inmediatamente cuántos meses y cuánto interés ahorraría pagando ese extra cada mes"}
  - {id: "AC-5.4",  desc: "Dado método 'Avalancha', las tarjetas aparecen ordenadas de mayor a menor tasa EA"}
  - {id: "AC-5.5",  desc: "Dado método 'Bola de nieve', las tarjetas se ordenan de menor a mayor saldo"}
  - {id: "AC-5.6",  desc: "Dado deudas registradas, veo: obligación mensual total, saldo total, utilización global, DTI en medidor visual y fecha libre de deudas"}
  - {id: "AC-5.7",  desc: "Dado tarjeta con fecha de corte en los próximos 7 días, aparece alerta de pago próximo en dashboard con monto mínimo"}
  - {id: "AC-6.1",  desc: "Dado tarjeta registrada, cuando agrego cuota activa (nombre, total, cuotas), el sistema calcula el monto mensual automáticamente"}
  - {id: "AC-6.2",  desc: "Dado cuotas activas en tarjeta, la obligación mensual mostrada incluye pago mínimo más suma de todas las cuotas activas"}
  - {id: "AC-6.3",  desc: "Dado cuota con cuotas pagadas, el progreso es visible (pagadas / total)"}
  - {id: "AC-7.1",  desc: "Dado meta con nombre/objetivo/ahorrado/aporte, veo: porcentaje de progreso, monto ahorrado vs objetivo y fecha estimada de llegada"}
  - {id: "AC-7.2",  desc: "Dado fecha límite en meta, el aporte mensual necesario se recalcula para llegar a esa fecha"}
  - {id: "AC-7.3",  desc: "Dado total aportes mensuales de metas supera presupuesto de ahorro, aparece advertencia con monto de exceso"}
  - {id: "AC-7.4",  desc: "Dado monto ahorrado alcanza el objetivo, la meta aparece como completada con indicador visual celebratorio"}
  - {id: "AC-7.5",  desc: "Dado varias metas, puedo reordenarlas para indicar prioridad"}
  - {id: "AC-8.1",  desc: "Dado categoría de gasto variable, la barra cambia de verde a ámbar al 80% y a rojo al superar el 100%"}
  - {id: "AC-8.2",  desc: "Dado categoría supera su presupuesto, en el dashboard aparece alerta con nombre, monto gastado y monto excedido"}
  - {id: "AC-8.3",  desc: "Dado estar en dashboard o sección de gastos variables, el botón flotante de registro rápido abre panel sin navegar. En demás secciones no aparece"}
  - {id: "AC-8.4",  desc: "Dado que el mes cambia, cuando abro la app, el sistema pregunta si quiero reiniciar montos gastados conservando presupuestos"}
  - {id: "AC-8.5",  desc: "Dado total gastado en variables supera total presupuestado, el exceso se muestra en rojo con porcentaje de sobrecosto"}
  - {id: "AC-9.1",  desc: "Dado activo registrado (nombre, tipo, valor), aparece en la lista y el total de activos se actualiza"}
  - {id: "AC-9.2",  desc: "Dado deudas registradas, en sección de patrimonio los saldos aparecen automáticamente como pasivos sin ingresarlos nuevamente"}
  - {id: "AC-9.3",  desc: "Dado activos y pasivos, el banner de patrimonio muestra patrimonio neto (activos − pasivos) en verde positivo o rojo negativo"}
  - {id: "AC-9.4",  desc: "Dado patrimonio neto negativo, el indicador de salud financiera refleja este dato en su puntuación compuesta"}
  - {id: "AC-10.1", desc: "Dado apertura de app, en dashboard veo: ingreso bruto, neto, gastos fijos, pagos deuda, libre para asignar, total metas/mes, puntaje salud"}
  - {id: "AC-10.2", desc: "Dado datos en múltiples secciones, los gráficos de distribución (donut) y proyección 12 meses están visibles sin scroll excesivo"}
  - {id: "AC-10.3", desc: "Dado indicador en zona de riesgo (DTI>36%, ahorro<20%, vivienda>30%), ese indicador tiene color de alerta y mensaje de contexto breve"}
  - {id: "AC-10.4", desc: "Dado todos los datos en verde, el estado visual general transmite claramente que la situación es saludable"}
  - {id: "AC-11.1", desc: "Dado al menos ingreso y gastos registrados, el dashboard muestra puntaje de salud 0-100 con etiqueta descriptiva"}
  - {id: "AC-11.2", desc: "Dado clic en el puntaje, aparece desglose de los 4 componentes: DTI 35%, emergencia 30%, vivienda 20%, ahorro 15%, con valor actual, umbral ideal y semáforo"}
  - {id: "AC-11.3", desc: "Dado puntaje cambia entre mes actual y mes anterior guardado, se muestra flecha y diferencia numérica de mejora/empeoramiento"}
  - {id: "AC-11.4", desc: "Dado insuficientes datos para algún componente, ese componente aparece como 'sin datos' y el puntaje se calcula con los disponibles"}
  - {id: "AC-12.1", desc: "Dado ingreso, gastos y deudas registrados, la proyección muestra gráfico con 12 meses mostrando balance acumulado positivo/negativo"}
  - {id: "AC-12.2", desc: "Dado ingresos no mensuales, en la proyección esos ingresos aparecen como picos visibles en los meses que se reciben"}
  - {id: "AC-12.3", desc: "Dado balance proyectado negativo en algún mes futuro, ese mes aparece destacado visualmente como punto de riesgo"}
  - {id: "AC-12.4", desc: "Dado cambio en cualquier dato (ingreso, gasto, meta), al regresar al dashboard la proyección se recalcula automáticamente"}
  - {id: "AC-13.1", desc: "Dado primer día de nuevo mes, cuando abro la app, el sistema guarda el snapshot del mes anterior automáticamente con notificación breve no bloqueante"}
  - {id: "AC-13.2", desc: "Dado guardar resumen mensual, el sistema almacena: fecha, ingreso neto, total gastos, total deudas, DTI, tasa de ahorro, patrimonio neto y puntaje de salud"}
  - {id: "AC-13.3", desc: "Dado al menos dos snapshots mensuales guardados, el dashboard muestra comparación (+/−) respecto al mes anterior"}
  - {id: "AC-13.4", desc: "Dado navegación a sección historial, veo lista de snapshots con sus métricas clave, ordenados del más reciente al más antiguo"}
  - {id: "AC-14.1", desc: "Dado ajuste de porcentaje Necesidades y Deseos, Ahorro se calcula automáticamente como complemento (100 − necesidades − deseos)"}
  - {id: "AC-14.2", desc: "Dado intento de asignar necesidades + deseos > 100%, el campo en conflicto se pone en rojo y no permite ese valor"}
  - {id: "AC-14.3", desc: "Dado asignación configurada, cada bucket muestra porcentaje y monto equivalente en moneda basado en ingreso neto total"}
  - {id: "AC-14.4", desc: "Dado pagos de deuda superan bucket de ahorro asignado, aparece aviso de que las deudas consumen el presupuesto de ahorro"}
  - {id: "AC-15.1", desc: "Dado clic en 'Exportar', obtengo un archivo con todos mis datos financieros que puedo abrir y leer"}
  - {id: "AC-15.2", desc: "Dado archivo exportado previamente, cuando lo importo, todos los datos (ingresos, gastos, deudas, metas, activos, historial) se restauran exactamente"}
  - {id: "AC-15.3", desc: "Dado intento de importar archivo inválido o corrupto, aparece mensaje de error claro y los datos actuales no se modifican"}
  - {id: "AC-15.4", desc: "Dado clic en 'Reiniciar' y confirmación, todos los datos se eliminan y la app vuelve al estado inicial de onboarding"}
  - {id: "AC-16.1", desc: "Dado acceso desde teléfono, la navegación es accesible con el pulgar (menú inferior o hamburguesa) sin scroll para llegar a controles principales"}
  - {id: "AC-16.2", desc: "Dado uso con teclado (Tab, Enter), todos los controles interactivos son alcanzables y el foco visual es visible en todo momento"}
  - {id: "AC-16.3", desc: "Dado cambio entre modo claro y oscuro, toda la interfaz (incluyendo gráficos y formularios) cambia correctamente sin texto ilegible"}
  - {id: "AC-16.4", desc: "Dado cambio de idioma a inglés, todo el texto visible (etiquetas, placeholders, errores, alertas) aparece en inglés. El cambio inverso funciona igual"}
  - {id: "AC-17.1", desc: "Dado modo oscuro activo, todo el texto tiene contraste suficiente — ningún texto claro sobre fondo claro ni oscuro sobre oscuro"}
  - {id: "AC-17.2", desc: "Dado modo oscuro activo, los colores de los gráficos son visibles — no aparecen fondos blancos ni bordes sin estilo"}
  - {id: "AC-17.3", desc: "Dado pantalla de 375px, ningún elemento se superpone con otro — formularios, botones, etiquetas y valores tienen espacio suficiente"}
  - {id: "AC-17.4", desc: "Dado pantalla de 768px o 1280px, el layout aprovecha el espacio disponible sin áreas vacías excesivas ni elementos desbordados"}
  - {id: "AC-17.5", desc: "Dado múltiples tipos de información en dashboard, la jerarquía visual es clara: puntaje de salud e indicadores clave son más prominentes"}
  - {id: "AC-17.6", desc: "Dado indicadores con colores semáforo, el estado también se comunica con ícono o etiqueta de texto — el color no es el único diferenciador"}
  - {id: "AC-17.7", desc: "Dado interacción con botón, input o elemento clickeable, el elemento da retroalimentación visual clara: color, elevación o borde de enfoque"}
  - {id: "AC-17.8", desc: "Dado sección con datos vacíos, se muestra mensaje amigable con ícono ilustrativo y acción sugerida, no solo espacio en blanco"}
  - {id: "AC-17.9", desc: "Dado navegación entre secciones, la transición es suave y no hay saltos bruscos de layout ni flashes de contenido sin estilo"}
  - {id: "AC-17.10", desc: "Dado tooltips en móvil, el tooltip aparece dentro del viewport sin quedar cortado por los bordes de la pantalla"}

