ac:
  - {id: "AC-1.1", desc: "Load error shows visible notification — no silent empty start"}
  - {id: "AC-1.2", desc: "Load-error notification persists until user dismisses it"}
  - {id: "AC-1.3", desc: "Save failure shows notification with retry option"}
  - {id: "AC-1.4", desc: "Dismissing error notification leaves app fully usable"}
  - {id: "AC-2.1", desc: "DTI tooltip: definition + ≤20% healthy, >36% risky"}
  - {id: "AC-2.2", desc: "Housing ratio tooltip: definition + ≤30% recommended"}
  - {id: "AC-2.3", desc: "Emergency fund tooltip: months covered + 3–6 month range"}
  - {id: "AC-2.4", desc: "Savings rate tooltip: share of net income toward goals"}
  - {id: "AC-2.5", desc: "Health score tooltip: 0–100 scale + four components named"}
  - {id: "AC-2.6", desc: "Tooltips fully visible on 375px viewport — no clipping"}
  - {id: "AC-2.7", desc: "Tooltip appears on keyboard focus (same content as hover)"}
  - {id: "AC-3.1", desc: "No income registered → dashboard shows income CTA"}
  - {id: "AC-3.2", desc: "Income registered, no expenses → dashboard shows expenses CTA"}
  - {id: "AC-3.3", desc: "Empty-state CTA disappears after missing data is added"}
  - {id: "AC-3.4", desc: "Partial data: calculable metrics shown + only missing-data prompt"}
  - {id: "AC-4.1", desc: "Salary > $5,694,000 → Colombia presets include 1% solidarity fund"}
  - {id: "AC-4.2", desc: "Salary ≤ $5,694,000 → Colombia presets do NOT include solidarity fund"}
  - {id: "AC-4.3", desc: "Applying Colombia presets twice does not duplicate solidarity fund"}
  - {id: "AC-4.4", desc: "Solidarity fund not auto-removed when salary drops below threshold"}
  - {id: "AC-5.1", desc: "Salary ≤ $2,847,000 + no transport benefit → suggestion banner shown"}
  - {id: "AC-5.2", desc: "Accepting suggestion adds Auxilio de transporte $200,000 and hides banner"}
  - {id: "AC-5.3", desc: "Transport benefit already present → suggestion banner not shown"}
  - {id: "AC-5.4", desc: "Dismissing suggestion → banner gone for rest of session"}
  - {id: "AC-5.5", desc: "Salary changes above $2,847,000 after transport added → one-time notice shown"}

