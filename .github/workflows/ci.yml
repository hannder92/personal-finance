name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    # ubuntu-latest moved to 26.04, where `playwright install --with-deps chromium`
    # fails ("Playwright does not support chromium on ubuntu26.04-x64").
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
